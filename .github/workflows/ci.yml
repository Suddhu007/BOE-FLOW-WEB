name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign-ui]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run pure-function tests
        run: npm test
      - name: Build frontend
        run: npm run build
